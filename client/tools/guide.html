<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Guide</title>
  <style>
    :root { --ink: #1a1226; --panel: rgba(36, 27, 54, 0.94); --line: #3a2f52; --text: #f3ecff; --dim: #a99cc4; --yellow: #ffd43b; --pink: #ff5d8f; --teal: #39c5bb; --green: #7ddc6a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    /* The engine sizes this canvas to the window (gfx.ts); the panels sit on top of it. */
    #game { position: fixed; inset: 0; display: block; cursor: grab; }
    #game.drag { cursor: grabbing; }
    header { position: fixed; left: 0; right: 0; top: 0; height: 44px; display: flex; gap: 8px; align-items: center; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 2; }
    header h1 { font-size: 15px; margin: 0 12px 0 0; }
    header button, .poses button { background: #241b36; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font: inherit; cursor: pointer; }
    header button.on, .poses button.on { background: var(--yellow); color: var(--ink); border-color: var(--yellow); font-weight: 700; }
    header a { color: var(--dim); }
    header select { background: #241b36; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
    #list { position: fixed; left: 0; top: 44px; bottom: 0; width: 230px; overflow: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 8px; z-index: 1; }
    #list h3, #info h3 { margin: 12px 4px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
    #list .it { display: flex; gap: 8px; align-items: baseline; border: 1px solid transparent; border-radius: 8px; padding: 5px 8px; cursor: pointer; }
    #list .it:hover { border-color: var(--line); }
    #list .it.sel { border-color: var(--yellow); background: #2f2446; }
    #list .it small { margin-left: auto; color: var(--dim); white-space: nowrap; }
    #info { position: fixed; right: 0; top: 44px; bottom: 0; width: 400px; overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 14px; z-index: 1; }
    #info h2 { margin: 0; font-size: 22px; color: var(--yellow); }
    #info .sub { color: var(--pink); margin: 2px 0 10px; }
    #info p { margin: 6px 0; }
    #info .lore { color: var(--dim); font-style: italic; }
    #info .how b { color: var(--green); }
    .stats { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; }
    .stats b { color: var(--dim); font-weight: 400; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th, td { text-align: right; padding: 2px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--dim); font-weight: 400; font-size: 11px; }
    th:first-child, td:first-child { text-align: left; }
    td.best { color: var(--green); } td.bad { color: var(--pink); }
    .poses { position: fixed; left: 242px; right: 412px; bottom: 12px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; z-index: 1; }
    #hint { position: fixed; left: 242px; top: 54px; color: var(--dim); font-size: 12px; z-index: 1; }
    .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--line); margin-right: 4px; }
    @media (max-width: 900px) { #info { width: 300px; } .poses { right: 312px; } }
    /* Maps tab: the chapter map viewer (maps.ts) takes over everything under the header. */
    #mapview { position: fixed; left: 0; right: 0; top: 44px; bottom: 0; z-index: 3; background: var(--ink); display: grid; grid-template-columns: 380px 1fr; grid-template-rows: auto 1fr; }
    #mapview[hidden] { display: none; }
    #mapbar { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    #mapbar button, #mapbar label { background: #241b36; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font: inherit; cursor: pointer; }
    #mapbar button.on { background: var(--yellow); color: var(--ink); border-color: var(--yellow); font-weight: 700; }
    #mapbar label { display: inline-flex; gap: 4px; align-items: center; }
    #side { overflow: auto; border-right: 1px solid var(--line); padding: 12px; background: #241b36; }
    #side h2 { margin: 0; font-size: 20px; color: var(--yellow); }
    #side h3 { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
    #side .sub { color: var(--pink); margin: 2px 0 8px; }
    #side .intro { color: var(--dim); font-style: italic; }
    #side .err { color: #ff8080; } #side .warn { color: #ffc46b; }
    #side .issues div { padding: 2px 0; }
    #side ol { padding: 0; margin: 0; list-style: none; }
    #side li.step { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; cursor: pointer; }
    #side li.step:hover { border-color: var(--dim); }
    #side li.step.sel { border-color: var(--yellow); background: #2f2446; }
    #side li.step .hd { display: flex; gap: 6px; align-items: baseline; }
    #side li.step .n { font-weight: 700; color: var(--yellow); min-width: 20px; }
    #side li.step .k { font-size: 11px; padding: 0 5px; border-radius: 4px; background: var(--line); white-space: nowrap; }
    #side li.step .m { margin-left: auto; color: var(--dim); font-size: 11px; white-space: nowrap; }
    #side li.step .flags { font-size: 11px; color: var(--teal); }
    #side li.step .radio { display: none; margin-top: 4px; color: var(--dim); }
    #side li.step.sel .radio { display: block; }
    #side li.step .radio b { color: var(--text); }
    #side li.step a { color: var(--yellow); font-size: 11px; }
    #side .notes div { margin-bottom: 6px; } #side .notes b { color: var(--text); }
    #mapmain { position: relative; overflow: hidden; }
    #cv { display: block; width: 100%; height: 100%; cursor: grab; }
    #cv.drag { cursor: grabbing; }
    #tip { position: absolute; pointer-events: none; background: rgba(20, 14, 32, 0.92); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; white-space: pre; font: 12px ui-monospace, monospace; display: none; }
    #legend { position: absolute; right: 10px; bottom: 10px; background: rgba(20, 14, 32, 0.88); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 11px; display: grid; grid-template-columns: repeat(2, auto); gap: 2px 12px; }
    #legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; background: var(--c); border: 1px solid #0006; border-radius: 2px; }
    @media (max-width: 800px) { #mapview { grid-template-columns: 1fr; grid-template-rows: auto 45vh 1fr; } #side { border-right: 0; border-bottom: 1px solid var(--line); } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <header>
    <h1>📖 <span>Game Guide</span></h1>
    <span id="tabs"></span>
    <span style="flex:1"></span>
    <select id="lang" title="Language"></select>
  </header>
  <aside id="list"></aside>
  <div id="hint">drag to turn · wheel to zoom</div>
  <div class="poses" id="poses"></div>
  <aside id="info"></aside>
  <section id="mapview" hidden>
    <div id="mapbar"><span id="chtabs"></span><span style="flex:1"></span><span id="layers"></span><button id="fit">Fit</button></div>
    <aside id="side"></aside>
    <div id="mapmain"><canvas id="cv"></canvas><div id="tip"></div><div id="legend"></div></div>
  </section>
  <script type="module" src="./guide.ts"></script>
</body>
</html>
